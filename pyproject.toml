[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diematic-modbus"
version = "0.1.0"
description = "Read and control a De Dietrich Diematic heating regulator over Modbus"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["modbus", "diematic", "de-dietrich", "boiler", "heating", "home-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Home Automation",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["modbus-connection>=4.8.1,<5"]

[project.optional-dependencies]
cli = ["modbus-connection[tmodbus]>=4.10.0,<5"]

[project.urls]
Homepage = "https://github.com/DaanVervacke/diematic-modbus"

[tool.hatch.build.targets.wheel]
packages = ["src/diematic_modbus"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.14", "mypy>=1.13"]

[tool.ruff]
target-version = "py312"
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "D", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"scripts/*" = ["D"]

[tool.mypy]
python_version = "3.12"
packages = ["diematic_modbus"]
mypy_path = "src"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
