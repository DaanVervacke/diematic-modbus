name: Gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        resolution: [highest, lowest-direct]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --group dev --resolution ${{ matrix.resolution }}
      - run: uv run python -m scripts.check
      - run: uv build
      - name: Assert py.typed shipped in wheel
        run: |
          wheel=$(ls dist/diematic_modbus-*.whl | head -1)
          unzip -l "$wheel" | grep -q 'diematic_modbus/py.typed'
